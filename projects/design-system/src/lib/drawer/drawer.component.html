@if (open()) {
  <!-- Decorative, non-interactive backdrop: a click-to-dismiss convenience for pointer users,
       never the only way to close (Escape and the header close button both work identically for
       a keyboard user), so it deliberately isn't a focusable/keyboard-operable control itself. -->
  <div class="ums-drawer__backdrop" aria-hidden="true" (click)="onBackdropClick()"></div>
  <div
    #panel
    class="ums-drawer__panel"
    [attr.data-position]="position()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    tabindex="-1"
    (keydown)="onPanelKeydown($event)"
  >
    <header class="ums-drawer__header">
      <h2 [id]="titleId" class="ums-drawer__title">{{ title() }}</h2>
      <button
        type="button"
        class="ums-drawer__close"
        (click)="onCloseButtonClick()"
        aria-label="Close panel"
      >
        <ums-icon name="x" decorative />
      </button>
    </header>
    <div class="ums-drawer__body">
      <ng-content />
    </div>
    <footer class="ums-drawer__footer">
      <ng-content select="[umsDrawerFooter]" />
    </footer>
  </div>
}
