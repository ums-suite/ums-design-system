<div class="ums-otp-input__row" role="group" [attr.aria-label]="label()">
  @for (index of boxIndexes(); track index) {
    <input
      #box
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      class="ums-otp-input__box"
      [class.ums-otp-input__box--invalid]="invalid()"
      [id]="boxId(index)"
      [attr.data-index]="index"
      [attr.aria-label]="'Digit ' + (index + 1) + ' of ' + length()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [disabled]="disabled()"
      [value]="digitAt(index)"
      maxlength="1"
      (input)="onInput(index, $event)"
      (keydown)="onKeydown(index, $event)"
      (paste)="onPaste(index, $event)"
    />
  }
</div>
