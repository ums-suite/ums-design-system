<header class="catalog-header">
  <h1>UMS Design System Catalog</h1>
  <div class="catalog-header__theme-toggle" role="group" aria-label="Theme">
    @for (mode of modes; track mode) {
      <button
        type="button"
        class="catalog-header__theme-button"
        [attr.aria-pressed]="theme.mode() === mode"
        [attr.data-testid]="'theme-toggle-' + mode"
        (click)="setTheme(mode)"
      >
        {{ mode }}
      </button>
    }
  </div>
</header>

<main class="catalog-main">
  <app-button-catalog />
  <app-form-catalog />
  <app-data-display-catalog />
  <app-data-table-catalog />
  <app-date-time-catalog />
  <app-state-surface-catalog />
  <app-navigation-catalog />
  <app-overlay-catalog />
  <app-command-palette-catalog />
  <app-charts-catalog />
  <!--
    Positioned last among visually-tested sections (after Charts, DSYS-16's own precedent for the
    same reason -- see that component's own app.ts comment history): every section ABOVE this one
    already has a pixel-baseline e2e screenshot committed, and Angular's flow layout means new
    content inserted BEFORE those sections shifts their rendered position by a sub-pixel amount
    that (as verified while building DSYS-10) is enough to flip a handful of hard-edged/bordered
    elements' anti-aliasing and fail their unrelated snapshot diffs. Icon/Asset registries below
    have no such snapshots, so appending here (not among the earlier form primitives, where DSYS-8
    grouping would otherwise suggest) avoids that churn entirely.
  -->
  <app-rich-text-editor-catalog />
  <app-icon-catalog />
  <app-asset-catalog />
</main>
<ums-toast-container />
